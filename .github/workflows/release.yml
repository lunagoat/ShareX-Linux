name: Release

# Push a tag such as v21.0.0-linux.1 (or run the workflow by hand) to publish a GitHub release
# containing the self-contained build that install.sh downloads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example v21.0.0-linux.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build release archive
        run: scripts/linux/make-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/release/sharex-linux-x64.tar.gz dist/release/sharex-linux-x64.tar.gz.sha256 \
            --title "ShareX for Linux $TAG" --generate-notes --target "$GITHUB_SHA" \
          || gh release upload "$TAG" dist/release/sharex-linux-x64.tar.gz dist/release/sharex-linux-x64.tar.gz.sha256 --clobber
